---
layout: default
---
<style>
.navbar {
    background: #1e1e1e;
    overflow: hidden;
    display: flex;
    justify-content: center;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 6px;
}
.navbar a {
    color: #f2f2f2;
    text-align: center;
    padding: 10px 16px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    margin: 0 8px;
    border-radius: 4px;
    transition: background 0.3s;
}
.navbar a:hover {
    background-color: #333;
    color: white;
}

/* Copy button styles */
.code-container {
    position: relative;
    margin-top: 10px;
}
.code-scroll {
    overflow-x: auto;
    width: 100%;
    display: block;
}
.code-container pre,
.code-snippet,
.code-container code {
    background: #f6f8fa;
    padding: 12px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.85em;
    white-space: pre-wrap;
    color: #24292e;
    border: 1px solid #eaecef;
    margin-top: 0;
}


.install-section {
    font-family: system-ui, sans-serif;
    margin: 40px 0;
    padding: 20px;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    background: #fafafa;
}
.install-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 16px;
}
.install-note {
    font-size: 14px;
    color: #555;
    margin-top: 6px;
}
.code-snippet {
    background: #1e1e1e;
    color: #dcdcdc;
    padding: 12px;
    border-radius: 6px;
    font-family: Consolas, monospace;
    margin-top: 10px;
    white-space: pre-wrap;
}

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; margin-bottom: 40px;}
.card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; background: #fff; box-shadow: 0 1px 3px rgba(27,31,35,0.1); display: flex; flex-direction: column; justify-content: space-between; }
.card h3 { margin-top: 0; font-size: 1.25em; color: #24292e; }
.card p { font-size: 0.9em; color: #586069; flex-grow: 1; }
.install-btn {
    display: inline-block;
    text-align: center;
    padding: 10px 16px;
    background-color: #0366d6;
    color: white !important;
    text-decoration: none !important;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
    margin: 4px 0;
    transition: background-color 0.2s;
    white-space: nowrap;
}
.install-btn:hover {
    background-color: #005cc5;
}
.tag { display: inline-block; padding: 4px 8px; background-color: #f1f8ff; color: #0366d6; border-radius: 12px; font-size: 0.75em; font-weight: 600; margin-bottom: 12px; align-self: flex-start; }
.tag.skill { background-color: #e6ffed; color: #0366d6; border: 1px solid #0366d6; }
.cmd-preview { background: #f6f8fa; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 0.75em; white-space: nowrap; margin-top: 10px; color: #24292e; border: 1px solid #eaecef; }
.section-title { border-bottom: 2px solid #eaecef; padding-bottom: 10px; margin-top: 40px; }
.lookup-card { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
.lookup-card h2 { margin-top: 0; font-size: 1.25rem; }
.lookup-card label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.9rem; }
.lookup-card input[type="text"] { width: 100%; padding: 0.6rem; border: 1px solid #d1d5da; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
.lookup-card button { background: #0366d6; color: white; border: none; padding: 0.6rem 1.4rem; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 0.75rem; }
.lookup-card button:hover { background: #0254b3; }
.lookup-card button:disabled { background: #94c1ec; cursor: not-allowed; }
.deeplink-card { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 1rem; margin-top: 1rem; }
.deeplink-card h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
.deeplink-card p { margin: 0 0 0.75rem 0; color: #586069; font-size: 0.9rem; }
.deeplink-url { background: #24292e; color: #e1e4e8; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 0.8rem; padding: 0.75rem; border-radius: 4px; word-break: break-all; margin: 0.5rem 0; display: block; }
.copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    background: #0366d6;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 0;
    font-size: 0.75rem;
    cursor: pointer;
    transition: background 0.2s;
    z-index: 10;
    opacity: 0.7;
    display: flex;
    align-items: center;
    justify-content: center;
}
.copy-btn svg {
    width: 14px;
    height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
}
.copy-btn:hover { background: #005cc5; opacity: 1; }
.copy-btn:active { background: #004494; }
.cmd-badge { display: inline-block; background: #e1e4e8; color: #24292e; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-family: monospace; margin-right: 0.4rem; }
.env-badge { display: inline-block; background: #f1f8ff; color: #0366d6; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.75rem; margin-right: 0.3rem; margin-bottom: 0.3rem; }
.registry-loading { color: #0366d6; font-style: italic; margin-left: 0.5rem; }
.registry-error { color: #d73a49; background: #ffeef0; border: 1px solid #feb7c2; padding: 0.75rem; border-radius: 6px; margin-top: 1rem; }
</style>

<div class="navbar">
  <a href="{{ '/' | relative_url }}">🏠 Home</a>
  <a href="{{ '/extensions.html' | relative_url }}">🧩 Extensions & Skills</a>
  <a href="{{ '/docs/documentation.html' | relative_url }}">📚 Documentation</a>
  <a href="https://github.com/sheldonrobinson/ai-backend" target="_blank">📦 Repo</a>
  <span style="color:#f2f2f2; font-size:0.85em; margin-left:8px;">If you find this useful, please go to repo and give a ⭐</span>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    var seen = new Set();
    // collect candidate blocks: existing preview classes and fenced code blocks
    var candidates = Array.from(document.querySelectorAll('.cmd-preview, .code-snippet'));
    // include pre>code (fenced code blocks)
    Array.prototype.push.apply(candidates, Array.from(document.querySelectorAll('pre > code')));

    candidates.forEach(function(node) {
        // target element to wrap: for pre>code use the parent PRE
        var target;
        if (node.tagName === 'CODE' && node.parentNode && node.parentNode.tagName === 'PRE') {
            target = node.parentNode; // pre
            // Skip if pre is inside .cmd-preview or .code-snippet
            // (it will be handled when we process the parent .cmd-preview)
            if (target.closest('.cmd-preview, .code-snippet')) return;
        } else {
            target = node; // .cmd-preview or .code-snippet
        }
        if (seen.has(target)) return;
        seen.add(target);

        // Skip if target is already inside a .code-container
        if (target.closest('.code-container') !== target) return;

        // If not already wrapped, wrap in .code-container
        if (!target.classList.contains('code-container')) {
            var wrapper = document.createElement('div');
            wrapper.className = 'code-container';
            target.parentNode.insertBefore(wrapper, target);
            wrapper.appendChild(target);
            target = wrapper;
        }

        // Wrap the code content (.cmd-preview or .code-snippet) in an inner
        // scrollable div, so .code-container itself does not scroll.
        var content = target;
        // If target IS .cmd-preview or .code-snippet, use it directly.
        // Otherwise look for .cmd-preview or .code-snippet child.
        if (!target.classList.contains('cmd-preview') && !target.classList.contains('code-snippet')) {
            content = target.querySelector('.cmd-preview') || target.querySelector('.code-snippet') || target.querySelector('pre') || target;
        }
        var scrollDiv = target.querySelector('.code-scroll');
        if (!scrollDiv) {
            scrollDiv = document.createElement('div');
            scrollDiv.className = 'code-scroll';
            scrollDiv.style.overflowX = 'auto';
            // Move content into scrollDiv (only if it's a direct child of target)
            if (content.parentNode === target) {
                scrollDiv.appendChild(content);
            }
            target.appendChild(scrollDiv);
        }

        // Button goes inside .code-container (NOT inside scrollDiv) so it
        // stays fixed relative to the container when scrolling horizontally.
        if (target.querySelector('.copy-btn')) return;

        // SVG icons for copy / copied states
        var COPY_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M7 9.667A2.667 2.667 0 0 1 9.667 7h8.666A2.667 2.667 0 0 1 21 9.667v8.666A2.667 2.667 0 0 1 18.333 21H9.667A2.667 2.667 0 0 1 7 18.333z"></path><path d="M4.012 16.737A2 2 0 0 1 3 15V5c0-1.1.9-2 2-2h10c.75 0 1.158.385 1.5 1"></path></g></svg>';
        var CHECK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M0 0v1200h1200V424.289l-196.875 196.875v381.961h-806.25v-806.25h381.961L775.711 0zm1030.008 15.161l-434.18 434.25L440.7 294.283L281.618 453.438L595.821 767.57l159.082-159.082l434.18-434.25l-159.082-159.081z"></path></svg>';

        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerHTML = COPY_SVG;

        // Store the exact text to copy on the button element so it's
        // never confused with the button's own label text.
        var codeToCopy = '';
        var preview = target.querySelector('.cmd-preview');
        if (preview) {
            codeToCopy = preview.textContent;
        } else {
            var pre = target.querySelector('pre');
            if (pre) codeToCopy = pre.textContent;
            else codeToCopy = target.textContent;
        }
        btn.dataset.copyText = codeToCopy.trim();

        btn.addEventListener('click', function() {
            var text = btn.dataset.copyText;
            if (!navigator.clipboard) {
                // fallback
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); btn.innerHTML = CHECK_SVG; } catch (e) { alert('Copy failed'); }
                document.body.removeChild(ta);
                setTimeout(function(){ btn.innerHTML = COPY_SVG; }, 2000);
                return;
            }
            navigator.clipboard.writeText(text).then(function() {
                btn.innerHTML = CHECK_SVG;
                setTimeout(function() { btn.innerHTML = COPY_SVG; }, 2000);
            });
        });

        btnTarget.appendChild(btn);
    });
});
</script>
